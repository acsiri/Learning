<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Capture Card Payment UI</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: "Segoe UI", system-ui, sans-serif;
      background:
        radial-gradient(circle at top left, #7f5cff, transparent 40%),
        radial-gradient(circle at bottom right, #00ffd5, transparent 40%),
        linear-gradient(135deg, #0e0e2c, #1c1248);
      color: #fff;
    }

    .payment-card {
      width: 360px;
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(14px);
      border-radius: 18px;
      padding: 24px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.45);
    }

    h2 {
      text-align: center;
      margin-bottom: 12px;
      font-weight: 600;
    }

    .field {
      margin-bottom: 14px;
    }

    label {
      display: block;
      font-size: 0.85rem;
      margin-bottom: 6px;
      opacity: 0.85;
    }

    input {
      width: 90%;
      padding: 10px 12px;
      border-radius: 10px;
      border: none;
      font-size: 1rem;
      outline: none;
    }

    .row {
      display: flex;
      gap: 14px;
    }

    button {
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      border: none;
      font-size: 0.95rem;
      font-weight: 600;
      cursor: pointer;
    }

    .btn-secondary {
      margin-bottom: 14px;
      background: linear-gradient(135deg, #ff9a9e, #fad0c4);
      color: #101427;
    }

    .btn-primary {
      margin-top: 16px;
      background: linear-gradient(135deg, #7cffd1, #6aa4ff);
      color: #101427;
    }

    video, canvas {
      width: 100%;
      border-radius: 12px;
      margin-bottom: 10px;
      display: none;
    }

    .note {
      margin-top: 12px;
      text-align: center;
      font-size: 0.75rem;
      opacity: 0.6;
    }
  </style>
</head>
<body>

  <div class="payment-card">
    <h2>Card Payment using Camera</h2>

    <!-- Camera UI -->
    <button class="btn-secondary" onclick="openCamera()">Show Card to Read in Camera</button>

    <video id="video" autoplay></video>
    <canvas id="canvas"></canvas>

    <div class="field">
      <label>Card Number</label>
      <input type="text" id="cardNumber">
    </div>

    
 <!-- ✅ Card Holder Name -->
    <div class="field">
      <label>Card Holder Name</label>
      <input type="text" id="cardHolderName">
    </div>


    <div class="row">
      <div class="field" style="flex:1;">
        <label>Expiry Date</label>
        <input type="text" id="expiryDate">
      </div>
      <div><label></label></div>
      <div class="field" style="flex:1;">
        <label>CVV</label>
        <input type="password" id="cvv">
      </div>
    </div>

    <button class="btn-primary" onclick="demoOnly()">Pay</button>

    <div class="note">
      Demo UI only. No payment is processed.
    </div>
  </div>

  <script>
    let stream;

    async function openCamera() {
        clearfields();
      const video = document.getElementById("video");
      const canvas = document.getElementById("canvas");

      video.style.display = "block";
      canvas.style.display = "none";

      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: "environment" }
        });
        video.srcObject = stream;

        // Capture image after 3 seconds (demo behavior)
        setTimeout(captureImage, 3000);

      } catch (err) {
        alert("Camera access denied or unavailable.");
      }
    }

async function clearfields  () {
    document.getElementById("cardHolderName").value = "" ;
    document.getElementById("cardNumber").value = "";
    document.getElementById("expiryDate").value = "";
    
}

async function captureImage() {
  clearfields();
  const video = document.getElementById("video");
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");

  // Draw video frame to canvas
  canvas.width = video.videoWidth;
  canvas.height = video.videoHeight;
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

  // Stop camera
  stream.getTracks().forEach(track => track.stop());
  video.style.display = "none";
  canvas.style.display = "block";

  // ✅ Convert canvas → Blob → send to FastAPI
  canvas.toBlob(async (blob) => {
    const formData = new FormData();
    formData.append("file", blob, "capture.png");

    try {
      const response = await fetch("http://localhost:8000/ocr", {
        method: "POST",
        body: formData
      });

      const data = await response.json();
      console.log("OCR result:", data);

      let rawResponse = data.text;   // or response.text from backend

    // Remove markdown formatting
    let cleaned = rawResponse
        .replace(/```json/g, "")
         .replace(/```/g, "")
         .trim();

    let jasondata = JSON.parse(cleaned);


    console.log("Vendor:", jasondata.card_vendor);
    console.log("Name:", jasondata.card_holder_name);
    console.log("Card Number:", jasondata.card_number);
    console.log("Expiry:", jasondata.expiry_date);
    console.log("Validity:", jasondata.validity);


    
    document.getElementById("cardHolderName").value =
    jasondata.card_holder_name || "";

    document.getElementById("cardNumber").value =
    jasondata.card_number || "";

    document.getElementById("expiryDate").value =
    jasondata.expiry_date || "";


    } catch (error) {
      console.error("Error sending image:", error);
      alert("Failed to send image to server");
    }
  }, "image/png");
}

    function demoOnly() {
      alert("Demo only ✅");
    }


  </script>

</body>
</html>
